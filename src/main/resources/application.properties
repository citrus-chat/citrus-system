spring.application.name=citruschat

server.port=${SERVER_PORT:8200}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citruschat}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false


spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.devtools.restart.enabled=false

citrus.avatar.storage-dir=${AVATAR_STORAGE_DIR:uploads/avatars}
citrus.avatar.max-size-bytes=${AVATAR_MAX_SIZE_BYTES:5242880}