services:

  postgres:
    image: postgres:17
    container_name: citrus-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: citruschat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citruschat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: citrus-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/citruschat
      DB_USER: postgres
      DB_PASSWORD: admin

    ports:
      - "8200:8200"

    volumes:
      - .:/app
      - maven_cache:/root/.m2

    command: ./mvnw spring-boot:run

volumes:
  postgres_data:
  maven_cache: